<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN SLIMBET</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#111;color:#fff;font-family:Arial;padding:12px}input{padding:8px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;margin:4px}.card{background:#1e1e2a;padding:12px;border-radius:8px;margin:8px 0;border-left:4px solid gold}button{padding:8px 12px;border-radius:6px;border:none;font-weight:800;cursor:pointer;margin:2px}.won{background:#00ff88}.lost{background:#ff4444;color:#fff}.charge{background:gold}</style></head><body>
<h2 style="color:gold">ADMIN - Ricarica Saldi + Vincite</h2>
<input id="email" placeholder="Tua email admin"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login Admin</button>
<div id="users"></div><hr><div id="list"></div>
<script>
const SUPABASE_URL='https://qooxqqdcfcfncexjhddo.supabase.co';const SUPABASE_KEY='sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function login(){const e=document.getElementById('email').value;const p=document.getElementById('pass').value;const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});if(error)alert(error.message);else{loadUsers();loadBets();}}
async function loadUsers(){const {data}=await supa.from('profiles').select('*');let h='<h3 style="color:gold">Utenti - Ricarica Saldo</h3>';data.forEach(u=>{h+="<div class='card'>Utente ID: "+u.id+"<br>Saldo attuale: EUR "+parseFloat(u.balance).toFixed(2)+"<br><input id='amt_"+u.id+"' type='number' placeholder='Importo da aggiungere'><button class='charge' onclick=\"ricarica('"+u.id+"')\">RICARICA SALDO</button><button class='charge' style='background:#fff' onclick=\"setSaldo('"+u.id+"')\">IMPOSTA SALDO</button></div>";});document.getElementById('users').innerHTML=h;}
async function ricarica(uid){const amt=parseFloat(document.getElementById('amt_'+uid).value);if(!amt)return alert('Inserisci importo');const {data}=await supa.from('profiles').select('balance').eq('id',uid).single();const nuovo=parseFloat(data.balance)+amt;await supa.from('profiles').update({balance:nuovo}).eq('id',uid);alert('Ricaricato EUR '+amt+' - Nuovo saldo EUR '+nuovo);loadUsers();}
async function setSaldo(uid){const amt=parseFloat(document.getElementById('amt_'+uid).value);if(isNaN(amt))return alert('Importo');await supa.from('profiles').update({balance:amt}).eq('id',uid);alert('Saldo impostato a EUR '+amt);loadUsers();}
async function loadBets(){const {data}=await supa.from('bets').select('*').order('created_at',{ascending:false}).limit(100);let h='<h3 style="color:gold">Scommesse - Accredito Vincite</h3>';data.forEach(b=>{h+="<div class='card'><b>"+b.match+"</b><br>Utente: "+b.user_id+"<br>Stake EUR "+b.stake+" @"+b.odd+" -> Vincita EUR "+b.potential_win+"<br>Stato: <b>"+b.status+"</b><br><button class='won' onclick=\"setStatus('"+b.id+"','"+b.user_id+"',"+b.potential_win+",'won')\">VINTA + Ricarica EUR "+b.potential_win+"</button><button class='lost' onclick=\"setStatus('"+b.id+"','"+b.user_id+"',0,'lost')\">PERSA</button></div>";});document.getElementById('list').innerHTML=h;}
async function setStatus(betId,userId,vincita,stato){if(stato==='won'){const {data:prof}=await supa.from('profiles').select('balance').eq('id',userId).single();let nuovo=prof?parseFloat(prof.balance)+parseFloat(vincita):parseFloat(vincita);await supa.from('profiles').update({balance:nuovo}).eq('id',userId);alert('VINTA! Ricaricato EUR '+vincita+' - Nuovo saldo EUR '+nuovo.toFixed(2));}await supa.from('bets').update({status:stato}).eq('id',betId);loadBets();loadUsers();}
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN SLIMBET</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#111;color:#fff;font-family:Arial;padding:12px}input{padding:8px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;margin:4px}.card{background:#1e1e2a;padding:10px;border-radius:8px;margin:8px 0;border-left:4px solid gold}button{padding:6px 12px;border-radius:6px;border:none;font-weight:800;cursor:pointer;margin:2px}.won{background:#00ff88}.lost{background:#ff4444;color:#fff}</style></head><body>
<h2 style="color:gold">ADMIN SLIMBET - Gestione Vincite</h2>
<input id="email" placeholder="Email admin"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button>
<div id="list"></div>
<script>
const SUPABASE_URL='https://qooxqqdcfcfncexjhddo.supabase.co';const SUPABASE_KEY='sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function login(){const e=document.getElementById('email').value;const p=document.getElementById('pass').value;const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});if(error)alert(error.message);else load();}
async function load(){const {data}=await supa.from('bets').select('*').order('created_at',{ascending:false}).limit(100);let h='';data.forEach(b=>{h+="<div class='card'><b>"+b.match+"</b><br>Utente: "+b.user_id+"<br>Stake: EUR "+b.stake+" @"+b.odd+" -> Vincita EUR "+b.potential_win+"<br>Stato: <b>"+b.status+"</b><br><button class='won' onclick=\"setStatus('"+b.id+"','"+b.user_id+"',"+b.potential_win+",'won')\">METTI VINTA + Ricarica Saldo</button><button class='lost' onclick=\"setStatus('"+b.id+"','"+b.user_id+"',0,'lost')\">METTI PERSA</button></div>";});document.getElementById('list').innerHTML=h;}
async function setStatus(betId,userId,vincita,stato){
 if(stato==='won'){
   const {data:prof}=await supa.from('profiles').select('balance').eq('id',userId).single();
   let nuovo=prof?parseFloat(prof.balance)+parseFloat(vincita):parseFloat(vincita);
   await supa.from('profiles').update({balance:nuovo}).eq('id',userId);
   alert('VINTA! Saldo ricaricato di EUR '+vincita+' - Nuovo saldo EUR '+nuovo.toFixed(2));
 }
 await supa.from('bets').update({status:stato}).eq('id',betId);
 load();
}
</script></body></html>

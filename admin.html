<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN SLIMBET PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#0a0a0f;color:#fff;font-family:Arial;padding:14px}input{padding:10px;border-radius:10px;border:1px solid #444;background:#1a1a2e;color:#fff;margin:4px}.card{background:linear-gradient(135deg,#23233a,#1a1a2e);padding:14px;border-radius:14px;margin:10px 0;border-left:4px solid gold}button{padding:10px 14px;border-radius:10px;border:none;font-weight:900;cursor:pointer;margin:3px}.won{background:#00ff88;color:#000}.lost{background:#ff3344;color:#fff}.charge{background:gold;color:#000}</style></head><body><h2 style="color:gold">👑 ADMIN SLIMBET PRO - GESTIONE SALDI</h2><input id="email" placeholder="Email admin"><input id="pass" type="password" placeholder="Password"><button onclick="login()" style="background:gold">LOGIN ADMIN</button><div id="users"></div><hr style="border-color:#333;margin:20px 0"><div id="list"></div><script>const SUPABASE_URL='https://qooxqqdcfcfncexjhddo.supabase.co';const SUPABASE_KEY='sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function login(){const e=document.getElementById('email').value;const p=document.getElementById('pass').value;const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});if(error)alert(error.message);else{loadUsers();loadBets();}}async function loadUsers(){const {data}=await supa.from('profiles').select('*');let h='<h3 style="color:gold">💳 UTENTI - RICARICA SALDO</h3>';data.forEach(u=>{h+="<div class='card'>ID: "+u.id.substring(0,8)+"...<br><b>Saldo: EUR "+parseFloat(u.balance).toFixed(2)+"</b><br><input id='amt_"+u.id+"' type='number' placeholder='Importo'><button class='charge' onclick=\"ricarica('"+u.id+"')\">RICARICA +</button><button class='charge' style='background:#fff' onclick=\"setSaldo('"+u.id+"')\">IMPOSTA</button></div>";});document.getElementById('users').innerHTML=h;}async function ricarica(uid){const amt=parseFloat(document.getElementById('amt_'+uid).value);if(!amt)return alert('Importo');const {data}=await supa.from('profiles').select('balance').eq('id',uid).single();const nuovo=parseFloat(data.balance)+amt;await supa.from('profiles').update({balance:nuovo}).eq('id',uid);alert('✅ Ricaricato EUR '+amt+' - Nuovo saldo EUR '+nuovo.toFixed(2));loadUsers();}async function setSaldo(uid){const amt=parseFloat(document.getElementById('amt_'+uid).value);await supa.from('profiles').update({balance:amt}).eq('id',uid);alert('Saldo impostato EUR '+amt);loadUsers();}async function loadBets(){const {data}=await supa.from('bets').select('*').order('created_at',{ascending:false}).limit(100);let h='<h3 style="color:gold">🎫 SCHEDINE - VINCITA AUTOMATICA IN SALDO</h3>';data.forEach(b=>{h+="<div class='card'><b>"+b.match+"</b><br>Utente: "+b.user_id.substring(0,8)+"...<br>Stake EUR "+b.stake+" @"+b.odd+" → Vincita EUR "+b.potential_win+"<br>Stato: <b style='color:gold'>"+b.status.toUpperCase()+"</b><br><button class='won' onclick=\"setStatus('"+b.id+"','"+b.user_id+"',"+b.potential_win+",'won')\">✅ VINTA + Ricarica EUR "+b.potential_win+" nel saldo</button><button class='lost' onclick=\"setStatus('"+b.id+"','"+b.user_id+"',0,'lost')\">❌ PERSA</button></div>";});document.getElementById('list').innerHTML=h;}async function setStatus(betId,userId,vincita,stato){if(stato==='won'){const {data:prof}=await supa.from('profiles').select('balance').eq('id',userId).single();let nuovo=prof?parseFloat(prof.balance)+parseFloat(vincita):parseFloat(vincita);await supa.from('profiles').update({balance:nuovo}).eq('id',userId);alert('💰 VINTA! Accredito automatico EUR '+vincita+' - Nuovo saldo utente EUR '+nuovo.toFixed(2)+' (somma se aveva già saldo)');}await supa.from('bets').update({status:stato}).eq('id',betId);loadBets();loadUsers();}</script></body></htm

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN SLIMBET ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>body{background:#0e0e12;color:#fff;font-family:sans-serif;padding:16px}input,button{padding:10px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;margin:4px}.card{background:#1a1a23;padding:12px;border-radius:10px;margin:8px 0;border-left:4px solid #ffcc00}</style></head><body>
<h1 style="color:#ffcc00">SLIMBET ADMIN ONLINE</h1>
<div id="lock"><input id="pwd" type="password" placeholder="Password admin"><button onclick="unlock()">Entra</button></div>
<div id="panel" style="display:none"><button onclick="load()" style="background:#ffcc00;color:#000;font-weight:900">🔄 Aggiorna lista</button><div id="users"></div><h3 style="margin-top:20px">Tutte le giocate LIVE</h3><div id="bets"></div></div>
<script>
const SUPABASE_URL='https://qooxqqdcfcfncexjhddo.supabase.co';
const SUPABASE_KEY='sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function unlock(){if(document.getElementById('pwd').value!=='admin123')return alert('Password errata, usa admin123');document.getElementById('lock').style.display='none';document.getElementById('panel').style.display='block';load();}
async function load(){let {data:users}=await supa.from('users').select('*').order('created_at',{ascending:false});let h='';users.forEach(u=>{h+=`<div class="card"><b>${u.username}</b> - Saldo: ${parseFloat(u.balance).toFixed(2)}€ - Iscritto: ${new Date(u.created_at).toLocaleString('it-IT')}<br>Pass: ${u.password}<br><button onclick="rec('${u.username}',10)">+10€</button><button onclick="rec('${u.username}',20)">+20€</button><button onclick="rec('${u.username}',50)">+50€</button><button onclick="rec('${u.username}',100)">+100€</button><button onclick="rec('${u.username}',-parseFloat(${u.balance}))">Azzera</button><button onclick="delU('${u.username}')" style="background:#ff3333">Elimina</button></div>`});document.getElementById('users').innerHTML=h||'Nessun utente ancora';let {data:bets}=await supa.from('bets').select('*').order('created_at',{ascending:false}).limit(50);document.getElementById('bets').innerHTML=bets.map(b=>`<div class="card"><b>${b.username}</b> - ${new Date(b.created_at).toLocaleString('it-IT')} - ${b.stake}€ @${parseFloat(b.total_odds).toFixed(2)} -> ${parseFloat(b.potential_win).toFixed(2)}€<br>${b.picks.map(p=>p.match+' '+p.t).join('<br>')}</div>`).join('')||'Nessuna giocata';}
async function rec(u,amt){let {data}=await supa.from('users').select('balance').eq('username',u).single();let neu=parseFloat(data.balance)+amt;if(neu<0)neu=0;await supa.from('users').update({balance:neu}).eq('username',u);load();}
async function delU(u){if(!confirm('Eliminare '+u+'?'))return;await supa.from('users').delete().eq('username',u);load();}
</script></body></html>

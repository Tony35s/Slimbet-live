<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLIMBET LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0e0e12;color:#fff;padding-bottom:100px}
header{background:#15151c;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid #ffcc00;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:22px}.logo span{color:#ffcc00}
.saldo{background:#ffcc00;color:#000;padding:8px 14px;border-radius:8px;font-weight:800}
.tabs{display:flex;gap:18px;background:#1a1a23;padding:10px 16px;overflow-x:auto}
.tab{opacity:0.6;cursor:pointer}.tab.active{opacity:1;color:#ffcc00;border-bottom:2px solid #ffcc00;font-weight:700}
.main{padding:12px;max-width:800px;margin:0 auto}
.league{margin:12px 0;background:#1a1a23;border-radius:12px;border:1px solid #2a2a35;overflow:hidden}
.league-head{padding:12px 14px;display:flex;justify-content:space-between;font-weight:800;background:#1f1f2b;cursor:pointer}
.league-body{display:none}.league.open.league-body{display:block}
.match{padding:12px;border-top:1px solid #2a2a35}
.m-top{font-size:12px;color:#ffcc00;display:flex;justify-content:space-between;margin-bottom:8px}
.m-teams{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.o-btn{background:#2a2a35;border:1px solid #3a3a4a;border-radius:8px;padding:10px;text-align:center;font-weight:800;cursor:pointer}
.o-btn.sel{background:#ffcc00;color:#000}
.fab{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#ffcc00;color:#000;padding:14px 22px;border-radius:30px;font-weight:900;z-index:40;cursor:pointer;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#15151c;border-radius:20px 20px 0 0;max-height:85vh;overflow-y:auto;z-index:50;display:none;border-top:2px solid #ffcc00;padding:14px}
.sheet.open{display:block}
.slip-item{background:#1f1f2b;padding:8px;border-radius:8px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between}
.stake-box{background:#1f1f2b;padding:12px;border-radius:10px;margin-top:12px}
.stake-input{width:100%;padding:12px;border-radius:8px;background:#0e0e12;color:#fff;border:1px solid #444;margin-top:6px;font-size:16px}
.btn-gold{background:#ffcc00;color:#000;width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}
.bet-h{background:#1f1f2b;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:4px solid #888}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.gray{background:#888}.green{background:#22c55e}.red{background:#ef4444}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-box{background:#1a1a23;border-radius:16px;padding:16px;max-width:420px;width:100%;border:1px solid #333}
.login-box{max-width:400px;margin:80px auto;background:#1a1a23;padding:20px;border-radius:16px;border:1px solid #2a2a35}.login-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #3a3a4a;background:#0e0e12;color:white}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="logo">SLIMBET <span>LIVE</span></div><div class="saldo" id="bal">0€</div></header>
<div id="login" class="login-box"><h2>Accedi</h2><input id="email" placeholder="email"><input id="code" placeholder="SLIMBET50"><button class="btn-gold" onclick="doLogin()">ATTIVA</button></div>
<div id="app" style="display:none"><div class="tabs"><div class="tab active" onclick="setSport('calcio',this)">⚽ Calcio</div><div class="tab" onclick="setSport('basket',this)">🏀 Basket</div><div class="tab" onclick="setSport('tennis',this)">🎾 Tennis</div><div class="tab" onclick="setSport('mma',this)">🥊 MMA</div></div><div class="main" id="matches"></div></div>
<div class="fab" id="fab" onclick="toggleSheet()">🎟️ Schedina <span id="fabCount"></span> - <span id="fabPot">0€</span></div>
<div class="sheet" id="sheet">
<div style="width:40px;height:4px;background:#444;border-radius:2px;margin:0 auto 12px auto" onclick="toggleSheet()"></div>
<h2>Schedina <span id="sCount"></span> <span style="float:right;cursor:pointer" onclick="toggleSheet()">✕</span></h2>
<div id="slipContent" style="margin-top:10px"></div>
<div id="stakeArea" style="display:none"><div class="stake-box"><label>Puntata modificabile</label><input id="stake" type="number" class="stake-input" value="5" min="1" max="100" oninput="updPot()"><div style="display:flex;justify-content:space-between;margin-top:10px"><span>Quota totale</span><b id="tOdd">0</b></div><div style="display:flex;justify-content:space-between;margin-top:6px;color:#ffcc00;font-size:18px"><span>Vincita potenziale</span><b id="tPot">0€</b></div><button class="btn-gold" onclick="placeBet()">PIAZZA SCOMMESSA</button></div></div>
<div style="margin-top:20px;border-top:1px solid #333;padding-top:12px"><div style="display:flex;justify-content:space-between;cursor:pointer" onclick="document.getElementById('myList').classList.toggle('hidden')"><h3>Le mie schedine ▼</h3></div><div id="myList" style="margin-top:10px"></div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target.id=='modal')this.classList.remove('open')"><div class="modal-box" id="modalBox"></div></div>
<script>
let balance=parseFloat(localStorage.getItem('balance')||'0');
let slip=[];let allM=[];let myBets=JSON.parse(localStorage.getItem('myBets')||'[]');let curSport='calcio';
const PROMOS={SLIMBET50:50,SLIMBET20:20,SLIMBET10:10};
function doLogin(){let e=document.getElementById('email').value.trim().toLowerCase();let c=document.getElementById('code').value.trim().toUpperCase();if(!e.includes('@')){alert('Email non valida');return;}if(!PROMOS[c]){alert('Codice errato');return;}if(localStorage.getItem('used_'+c)){alert('Già usato');return;}balance+=PROMOS[c];localStorage.setItem('balance',balance);localStorage.setItem('slim_user',e);localStorage.setItem('used_'+c,'1');start();}
function start(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('fab').style.display='flex';document.getElementById('bal').innerText='Saldo: '+balance.toFixed(2)+'€';load();renderBets();}
function setSport(s,el){curSport=s;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
async function load(){try{let r=await fetch('/api/odds');let d=await r.json();if(d.matches?.length){allM=d.matches.map(m=>{let dt=new Date(m.commence_time);return{sport:'calcio',league:mapL(m.sport_key),date:fmt(dt),time:dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),home:m.home_team,away:m.away_team,odds:ext(m),dt}});}}catch(e){}allM=allM.concat(mockAll());render();}
function mapL(k){if(k.includes('serie_a'))return'Serie A';if(k.includes('epl'))return'Premier League';if(k.includes('la_liga'))return'La Liga';if(k.includes('bundesliga'))return'Bundesliga';if(k.includes('ligue'))return'Ligue 1';return'Serie A'}
function fmt(d){let n=new Date();let t=new Date();t.setDate(n.getDate()+1);if(d.toDateString()==n.toDateString())return'Oggi';if(d.toDateString()==t.toDateString())return'Domani';let days=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];return days[d.getDay()]+' '+d.getDate();}
function ext(m){try{let b=m.bookmakers[0].markets[0].outcomes;return{h:b.find(o=>o.name==m.home_team)?.price||1.9,a:b.find(o=>o.name==m.away_team)?.price||2.1,x:b.find(o=>o.name=='Draw')?.price||3.2}}catch{return{h:1.9,x:3.2,a:2.2}}}
function mockAll(){let now=new Date();let ad=d=>{let x=new Date();x.setDate(now.getDate()+d);return x};return[{sport:'calcio',league:'Serie A',date:'Oggi',time:'20:45',home:'Inter',away:'Juventus',odds:{h:2.10,x:3.30,a:3.60},dt:ad(0)},{sport:'calcio',league:'Serie A',date:'Oggi',time:'18:30',home:'Milan',away:'Napoli',odds:{h:2.40,x:3.20,a:2.95},dt:ad(0)},{sport:'calcio',league:'Serie A',date:'Domani',time:'20:45',home:'Roma',away:'Lazio',odds:{h:2.20,x:3.10,a:3.40},dt:ad(1)},{sport:'calcio',league:'Serie B',date:'Domani',time:'16:15',home:'Palermo',away:'Bari',odds:{h:2.00,x:3.00,a:3.80},dt:ad(1)},{sport:'calcio',league:'Premier League',date:'Oggi',time:'17:30',home:'Man City',away:'Arsenal',odds:{h:1.95,x:3.60,a:3.80},dt:ad(0)},{sport:'calcio',league:'La Liga',date:'Dom',time:'21:00',home:'Real Madrid',away:'Barcellona',odds:{h:1.90,x:3.50,a:4.00},dt:ad(2)},{sport:'calcio',league:'Bundesliga',date:'Sab',time:'15:30',home:'Bayern',away:'Dortmund',odds:{h:1.75,x:4.00,a:4.20},dt:ad(3)},{sport:'calcio',league:'Ligue 1',date:'Sab',time:'21:00',home:'PSG',away:'Marsiglia',odds:{h:1.60,x:4.20,a:5.00},dt:ad(3)},{sport:'basket',league:'NBA',date:'Oggi',time:'02:30',home:'Lakers',away:'Warriors',odds:{h:1.85,a:1.95},dt:ad(0)},{sport:'tennis',league:'ATP',date:'Domani',time:'14:00',home:'Sinner',away:'Alcaraz',odds:{h:2.10,a:1.75},dt:ad(1)},{sport:'mma',league:'UFC',date:'Sab',time:'04:00',home:'Topuria',away:'Volkanovski',odds:{h:1.70,a:2.15},dt:ad(3)}];}
function render(){let f=allM.filter(m=>m.sport==curSport).sort((a,b)=>a.dt-b.dt);let leagues=[...new Set(f.map(m=>m.league))];let html='';leagues.forEach((l,idx)=>{let ms=f.filter(m=>m.league==l);let open=idx==0?' open':'';html+=`<div class="league${open}"><div class="league-head" onclick="this.parentElement.classList.toggle('open')"><span>🏆 ${l}</span><span>${ms.length} partite ▼</span></div><div class="league-body">`;ms.forEach(m=>{let gi=allM.indexOf(m);html+=`<div class="match"><div class="m-top"><span>🕒 ${m.date} ${m.time}</span><span>${m.league}</span></div><div class="m-teams"><span>${m.home}</span><span style="opacity:.5">vs</span><span>${m.away}</span></div><div class="odds"><div class="o-btn ${isSel(gi,'1')?'sel':''}" onclick="pick(${gi},'1','${m.home}',${m.odds.h})">1 ${m.odds.h}</div>${m.odds.x?`<div class="o-btn ${isSel(gi,'X')?'sel':''}" onclick="pick(${gi},'X','Pareggio',${m.odds.x})">X ${m.odds.x}</div>`:`<div></div>`}<div class="o-btn ${isSel(gi,'2')?'sel':''}" onclick="pick(${gi},'2','${m.away}',${m.odds.a})">2 ${m.odds.a}</div></div></div>`;});html+=`</div></div>`;});document.getElementById('matches').innerHTML=html;}
function isSel(i,t){return slip.find(s=>s.idx==i&&s.type==t)}
function pick(i,t,name,o){slip=slip.filter(s=>s.idx!==i);slip.push({idx:i,type:t,name,odd:o,match:allM[i].home+' vs '+allM[i].away,league:allM[i].league,date:allM[i].date+' '+allM[i].time});render();updSlip();}
function updSlip(){let c=document.getElementById('slipContent');document.getElementById('sCount').innerText=slip.length?`(${slip.length})`:'';document.getElementById('fabCount').innerText=slip.length?`(${slip.length})`:'';if(!slip.length){c.innerHTML='<div style="opacity:.5;text-align:center;padding:20px">Nessuna selezione</div>';document.getElementById('stakeArea').style.display='none';document.getElementById('fabPot').innerText='0€';return;}document.getElementById('stakeArea').style.display='block';let h='';slip.forEach((s,i)=>{h+=`<div class="slip-item"><div><b>${s.league}</b><br>${s.match}<br>${s.type} ${s.name} @${s.odd}</div><div><span onclick="rem(${i})" style="color:#ff5555;cursor:pointer">✕</span></div></div>`});c.innerHTML=h;updPot();}
function rem(i){slip.splice(i,1);render();updSlip();}
function updPot(){let stake=parseFloat(document.getElementById('stake').value)||5;let tot=slip.reduce((a,b)=>a*parseFloat(b.odd),1);document.getElementById('tOdd').innerText=tot.toFixed(2);let pot=(tot*stake).toFixed(2);document.getElementById('tPot').innerText=pot+'€';document.getElementById('fabPot').innerText=pot+'€';}
function toggleSheet(){document.getElementById('sheet').classList.toggle('open')}
function placeBet(){let stake=parseFloat(document.getElementById('stake').value)||5;if(stake>balance){alert('Saldo insufficiente');return;}if(!slip.length){alert('Seleziona partite');return;}balance-=stake;localStorage.setItem('balance',balance);document.getElementById('bal').innerText='Saldo: '+balance.toFixed(2)+'€';let tot=slip.reduce((a,b)=>a*parseFloat(b.odd),1);let pot=(tot*stake).toFixed(2);let bet={id:Date.now(),date:new Date().toLocaleString('it-IT'),stake,total:tot.toFixed(2),pot,potRaw:pot,picks:[...slip],status:'live'};myBets.unshift(bet);localStorage.setItem('myBets',JSON.stringify(myBets));slip=[];updSlip();render();renderBets();}
function renderBets(){let el=document.getElementById('myList');if(!myBets.length){el.innerHTML='<div style="opacity:.5;font-size:13px">Nessuna schedina</div>';return;}let h='';myBets.forEach(b=>{let dot=b.status=='live'?'gray':b.status=='won'?'green':'red';let lbl=b.status=='live'?'In corso':b.status=='won'?'Vinta':'Persa';h+=`<div class="bet-h ${b.status}" onclick="openBet(${b.id})"><div style="display:flex;justify-content:space-between"><span><span class="dot ${dot}"></span><b>${lbl}</b> - ${b.date}</span><span>${b.stake}€ @${b.total}</span></div><div style="font-size:12px;opacity:.7;margin-top:4px">${b.picks.length} selezioni • Tocca per dettaglio</div><div style="color:#ffcc00;margin-top:4px">Potenziale: ${b.pot}€</div></div>`;});el.innerHTML=h;}
function openBet(id){let b=myBets.find(x=>x.id==id);if(!b)return;let dot=b.status=='live'?'gray':b.status=='won'?'green':'red';let lbl=b.status=='live'?'In corso':b.status=='won'?'Vinta':'Persa';let html=`<div style="display:flex;justify-content:space-between"><h3><span class="dot ${dot}"></span>${lbl}</h3><span onclick="document.getElementById('modal').classList.remove('open')" style="cursor:pointer">✕</span></div><div style="font-size:12px;opacity:.6;margin:8px 0">${b.date} • ${b.stake}€ @${b.total}</div><hr style="border:0;border-top:1px solid #333;margin:10px 0">`;b.picks.forEach(p=>{html+=`<div style="background:#0e0e12;padding:8px;border-radius:8px;margin-bottom:8px"><div style="font-size:12px;opacity:.6">${p.league} • ${p.date}</div><div style="font-weight:700">${p.match}</div><div>Esito: <b>${p.type} ${p.name}</b> @${p.odd}</div></div>`});html+=`<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:18px"><span>Vincita potenziale</span><b style="color:#ffcc00">${b.pot}€</b></div>`;document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open');}
if(localStorage.getItem('slim_user'))start();
</script>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIMBET PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#0e0e12;color:#fff;font-family:sans-serif;padding:12px;margin:0}.card{background:#1a1a23;padding:14px;border-radius:12px;margin:10px 0;border-left:5px solid #444;position:relative}.topbar{display:flex;justify-content:space-between;align-items:center;background:#111;padding:12px;border-radius:12px;border:1px solid gold}button{padding:10px 18px;border-radius:8px;border:none;font-weight:900;cursor:pointer;background:gold;color:#000}button:disabled{background:#333!important;color:#777!important}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.dot-won{background:#00ff88;box-shadow:0 0 8px #00ff88}.dot-lost{background:#ff4444}.dot-pending{background:#ffcc00;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}} .bet-won{border-left-color:#00ff88!important;background:linear-gradient(90deg,rgba(0,255,136,.15),transparent)!important}.bet-lost{border-left-color:#ff4444!important;background:linear-gradient(90deg,rgba(255,51,68,.15),transparent)!important}.bet-pending{border-left-color:#ffcc00!important;background:linear-gradient(90deg,rgba(255,204,0,.15),transparent)!important} .time-label{font-size:12px;color:#aaa} .closed{display:none!important}</style></head><body>
<div class="topbar"><h2 style="color:gold;margin:0">SLIMBET PRO</h2><div>Saldo: €<span id="saldo">0.00</span></div></div>

<h3 style="color:gold;margin-top:18px">⚽ Partite Oggi - Chiudono all'orario</h3>
<div id="matchesList">
<div class="card match-card" data-start="20:45"><b>Juventus vs Milan</b><br><small class="time-label">Inizio: 20:45</small><br><button onclick="piazza(this,'Juventus vs Milan',2.10)">Scommetti @2.10</button></div>
<div class="card match-card" data-start="21:00"><b>Napoli vs Inter</b><br><small class="time-label">Inizio: 21:00</small><br><button onclick="piazza(this,'Napoli vs Inter',1.95)">Scommetti @1.95</button></div>
<div class="card match-card" data-start="18:30"><b>Roma vs Lazio</b><br><small class="time-label">Inizio: 18:30</small><br><button onclick="piazza(this,'Roma vs Lazio',2.40)">Scommetti @2.40</button></div>
<div class="card match-card" data-start="20:41"><b>Test 20:41 (scade ora)</b><br><small class="time-label">Inizio: 20:41</small><br><button onclick="piazza(this,'Test',2.00)">Scommetti @2.00</button></div>
</div>

<h3 style="color:gold">🎯 Le Mie Scommesse <span style="font-size:12px;color:#888">(🟢 Vinta / 🔴 Persa / 🟡 In corso)</span></h3>
<div id="betsList"></div>

<script>
const SUPABASE_URL='https://qooxqqdcfcfncexjhddo.supabase.co';
const SUPABASE_KEY='sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function checkTime(){
  const now=new Date();
  document.querySelectorAll('.match-card').forEach(card=>{
    const t=card.dataset.start; if(!t) return;
    const [h,m]=t.split(':').map(Number);
    const start=new Date(); start.setHours(h,m,0,0);
    const btn=card.querySelector('button');
    const label=card.querySelector('.time-label');
    if(now>=start){
      card.classList.add('closed'); // TOLTA DALLA LISTA
    }else{
      const diff=Math.floor((start-now)/60000);
      if(diff<=15 && diff>=0){
        label.innerHTML=`⚠️ Chiude tra ${diff} min! - ${t}`;
        label.style.color='orange';
        btn.style.background='orange';
      } else {
        label.innerHTML=`Inizio: ${t}`;
      }
      card.classList.remove('closed');
    }
  });
}
setInterval(checkTime,10000); checkTime();

function piazza(btn,match,odd){
  const card=btn.closest('.match-card');
  const [h,m]=card.dataset.start.split(':').map(Number);
  const start=new Date(); start.setHours(h,m,0,0);
  if(new Date()>=start){ alert("⛔ Scommessa chiusa! Partita iniziata alle "+card.dataset.start); card.classList.add('closed'); return; }
  const stake=prompt(`Quanto punti su ${match} @${odd}?`);
  if(!stake) return;
  const pot=(parseFloat(stake)*odd).toFixed(2);
  const betsDiv=document.getElementById('betsList');
  betsDiv.innerHTML=`<div class="card bet-pending"><span class="dot dot-pending"></span><b>${match}</b><small style="float:right;color:#ffcc00">IN CORSO 🟡</small><br><small>Stake: €${stake} @${odd} | Vincita: €${pot}</small></div>`+betsDiv.innerHTML;
}
</script></body></html>

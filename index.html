<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIMBET PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#0e0e12;color:#fff;font-family:sans-serif;padding:12px;margin:0}.card{background:#1a1a23;padding:14px;border-radius:12px;margin:10px 0;border-left:5px solid #444}.topbar{display:flex;justify-content:space-between;align-items:center;background:#111;padding:12px;border-radius:12px;border:1px solid gold}button{padding:10px 18px;border-radius:8px;border:none;font-weight:900;cursor:pointer;background:gold;color:#000}button:disabled{background:#333!important;color:#777!important}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.dot-won{background:#00ff88}.dot-lost{background:#ff4444}.dot-pending{background:#ffcc00;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}.bet-won{border-left-color:#00ff88!important}.bet-lost{border-left-color:#ff4444!important}.bet-pending{border-left-color:#ffcc00!important}.closed{display:none!important}</style></head><body>
<div class="topbar"><h2 style="color:gold;margin:0">SLIMBET PRO</h2><div>Saldo: EUR <span id="saldo">125.00</span></div></div>
<h3 style="color:gold;margin-top:18px">OGGI 31 AGO - Partite Reali</h3>
<div id="matchesList">
<div class="card match-card" data-start="21:00"><b>Aston Villa vs Arsenal - Premier League</b><br><small>Inizio: 21:00</small><br><button onclick="piazza(this,'Aston Villa vs Arsenal',2.85)">Scommetti @2.85</button></div>
<div class="card match-card" data-start="21:30"><b>Barcellona vs Rayo Vallecano - LaLiga</b><br><small>Inizio: 21:30</small><br><button onclick="piazza(this,'Barcellona vs Rayo Vallecano',1.35)">Scommetti @1.35</button></div>
</div>
<h3 style="color:gold">Le Mie Scommesse</h3>
<div id="betsList"></div>
<script>
const SUPABASE_URL='https://qooxqqdcfcfncexjhddo.supabase.co';
const SUPABASE_KEY='sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function checkTime(){
  const now=new Date();
  document.querySelectorAll('.match-card').forEach(card=>{
    const t=card.dataset.start; if(!t) return;
    const parts=t.split(':'); const h=parseInt(parts[0]); const m=parseInt(parts[1]);
    const start=new Date(); start.setHours(h,m,0,0);
    if(now>=start){ card.classList.add('closed'); }
  });
}
setInterval(checkTime,10000); checkTime();
function piazza(btn,match,odd){
  const card=btn.closest('.match-card');
  const t=card.dataset.start.split(':'); const start=new Date(); start.setHours(parseInt(t[0]),parseInt(t[1]),0,0);
  if(new Date()>=start){ alert("Chiusa alle "+card.dataset.start); card.classList.add('closed'); return; }
  const stake=prompt("Quanto punti su "+match+" @"+odd+"?");
  if(!stake) return;
  const pot=(parseFloat(stake)*odd).toFixed(2);
  document.getElementById('betsList').innerHTML="<div class='card bet-pending'><span class='dot dot-pending'></span><b>"+match+"</b><br><small>Stake EUR "+stake+" @"+odd+" - Vincita EUR "+pot+"</small></div>"+document.getElementById('betsList').innerHTML;
}
</script></body></html>

<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIMBET PRO ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#0e0e12;color:#fff;padding-bottom:130px}header{background:#15151c;display:flex;justify-content:space-between;padding:12px 16px;border-bottom:2px solid #ffcc00;position:sticky;top:0;z-index:30}.league{margin:10px;background:#1a1a23;border-radius:12px;border:1px solid #2a2a35;overflow:hidden}.league-head{padding:14px;font-weight:800;display:flex;justify-content:space-between;background:#1f1f2b;cursor:pointer}.league-body{display:none}.league.open.league-body{display:block!important}.match{padding:12px;border-top:1px solid #2a2a35}.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.tab{padding:6px 12px;background:#2a2a35;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #333;white-space:nowrap}.tab.active{background:#ffcc00;color:#000;font-weight:900}.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.odds2{grid-template-columns:1fr 1fr}.odds4{grid-template-columns:1fr 1fr 1fr 1fr}.o-btn{background:#2a2a35;padding:9px;border-radius:8px;text-align:center;font-weight:800;cursor:pointer;font-size:12px;border:1px solid #3a3a45}.o-btn.sel{background:#ffcc00;color:#000}.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ffcc00;color:#000;padding:14px 26px;border-radius:30px;font-weight:900;z-index:40}.sheet{position:fixed;bottom:0;left:0;right:0;background:#15151c;max-height:88vh;overflow:auto;display:none;border-top:3px solid #ffcc00;padding:14px;border-radius:20px 20px 0 0;z-index:50}.sheet.open{display:block}#login{position:fixed;inset:0;background:#0e0e12;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{background:#1a1a23;padding:22px;border-radius:16px;width:100%;max-width:360px;border:1px solid #ffcc00;text-align:center}input{width:100%;padding:12px;border-radius:8px;background:#000;color:#fff;border:1px solid #444;margin-top:10px}</style></head><body>
<div id="login"><div class="login-box"><h2 style="color:#ffcc00">SLIMBET PRO</h2><p style="opacity:.7;font-size:13px;margin:8px 0">0€ senza codice - Promo SLIMBET10/20/50</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><input id="promo" placeholder="Codice Promo (SLIMBET10/20/50)" style="border-color:#ffcc00"><button onclick="doLogin()" style="background:#ffcc00;color:#000;width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;margin-top:14px">ENTRA / REGISTRATI</button><div id="msg" style="margin-top:10px;color:#ff5555;font-size:13px"></div></div></div>
<header><b>SLIMBET <span style="color:#ffcc00">PRO</span> ONLINE</b><div style="display:flex;gap:8px;align-items:center"><div id="bal" style="background:#ffcc00;color:#000;padding:7px 14px;border-radius:8px;font-weight:900">0.00€</div><div onclick="localStorage.removeItem('slim_user');location.reload()" style="background:#333;padding:7px 12px;border-radius:8px;cursor:pointer">Esci</div></div></header>
<div id="status" style="text-align:center;padding:8px;font-size:12px;opacity:.7">🔄 Carico LIVE...</div><div id="matches"></div><div class="fab" onclick="document.getElementById('sheet').classList.add('open')">Schedina (<span id="cnt">0</span>) - <span id="pot">0€</span></div><div class="sheet" id="sheet"><div style="display:flex;justify-content:space-between"><h2>Schedina</h2><span onclick="document.getElementById('sheet').classList.remove('open')" style="font-size:22px;cursor:pointer">✕</span></div><div id="slip">Nessuna</div><div id="stakeBox" style="display:none;margin-top:14px"><input id="stake" type="number" value="5" min="1" oninput="upd()"><div style="margin-top:10px">Quota: <b id="qTot">0</b> - Vincita: <b id="vTot" style="color:#ffcc00">0€</b></div><button style="background:#ffcc00;color:#000;width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin-top:10px" onclick="place()">PIAZZA</button></div><h3 style="margin-top:18px">Le mie giocate</h3><div id="my"></div></div>
<script>
const SUPABASE_URL = 'https://qooxqqdcfcfncexjhddo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6SH5fbxXEiI7wFrvo_YghQ_o4PU9EFA';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PROMOS={'SLIMBET10':10,'SLIMBET20':20,'SLIMBET50':50,'SLIM10':10,'SLIM20':20,'SLIM50':50};
let user=localStorage.getItem('slim_user'),balance=0,slip=[],allM=[],marketView={};
function pretty(k){let m={soccer_italy_serie_a:'Serie A',soccer_epl:'Premier League',soccer_spain_la_liga:'La Liga',soccer_germany_bundesliga:'Bundesliga',soccer_france_ligue_one:'Ligue 1',basketball_euroleague:'Eurolega',basketball_nba:'NBA'};return m[k]||k.replace('soccer_','').replaceAll('_',' ').toUpperCase();}
function parseOdds(m){let out={h2h:{}};try{m.bookmakers?.[0]?.markets?.forEach(mk=>{if(mk.key=='h2h')mk.outcomes.forEach(o=>{if(o.name==m.home_team)out.h2h.h=o.price;else if(o.name==m.away_team)out.h2h.a=o.price;else out.h2h.x=o.price;});});}catch(e){}if(!out.h2h.h)out.h2h={h:2.1,x:3.2,a:3.0};out.totals=[{name:'Over 0.5',price:1.08},{name:'Under 0.5',price:7.5},{name:'Over 1.5',price:1.32},{name:'Under 1.5',price:3.2},{name:'Over 2.5',price:1.92},{name:'Under 2.5',price:1.85},{name:'Over 3.5',price:3.1},{name:'Under 3.5',price:1.35}];out.btts={Yes:1.8,No:1.95};out.correct=[{name:'1-0',price:6.5},{name:'2-0',price:8.5},{name:'2-1',price:8},{name:'1-1',price:6},{name:'0-0',price:9}];return out;}
async function checkLogin(){if(!user)return;document.getElementById('login').style.display='none';let {data}=await supa.from('users').select('*').eq('username',user).single();if(data){balance=parseFloat(data.balance);document.getElementById('bal').innerText=balance.toFixed(2)+'€';loadMyBets();}}
checkLogin();
async function doLogin(){let u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim(),code=document.getElementById('promo').value.trim().toUpperCase(),msg=document.getElementById('msg');if(!u||!p){msg.innerText='Username e password obbligatori';return;}let {data:exist}=await supa.from('users').select('*').eq('username',u).single();if(exist){if(exist.password!==p){msg.innerText='Password errata per '+u;return;}localStorage.setItem('slim_user',u);location.reload();}else{let bonus=0;if(code){if(!PROMOS[code]){msg.innerText='Codice non valido. Usa SLIMBET10/20/50 o lascia vuoto per 0€';return;}bonus=PROMOS[code];}let {error}=await supa.from('users').insert([{username:u,password:p,balance:bonus}]);if(error){msg.innerText=error.message;return;}localStorage.setItem('slim_user',u);location.reload();}}
async function loadLive(){try{let r=await fetch('/api/odds?v='+Date.now());let d=await r.json();allM=d.matches.map(m=>{let dt=new Date(m.commence_time);return{...m,league:m.sport_key,home:m.home_team,away:m.away_team,date:dt.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),dt,oddsExt:parseOdds(m)}}).sort((a,b)=>a.dt-b.dt);document.getElementById('status').innerText='✅ ONLINE - '+allM.length+' partite';render();}catch(e){document.getElementById('status').innerText='⚠️ Errore API, riprovo...';}}
function render(){document.getElementById('bal').innerText=balance.toFixed(2)+'€';let leagues=[...new Set(allM.map(m=>m.league))];let h='';leagues.forEach((l,i)=>{let ms=allM.filter(m=>m.league==l);h+=`<div class="league ${i===0?'open':''}"><div class="league-head" onclick="this.parentElement.classList.toggle('open')"><span>🏆 ${pretty(l)}</span><span>${ms.length} ▼</span></div><div class="league-body">`;ms.forEach(m=>{let idx=allM.indexOf(m),mv=marketView[idx]||'1X2',o=m.oddsExt;h+=`<div class="match"><div style="font-size:11px;color:#ffcc00">🕒 ${m.date}</div><b>${m.home} vs ${m.away}</b><div class="tabs"><div class="tab ${mv==='1X2'?'active':''}" onclick="event.stopPropagation();setTab(${idx},'1X2')">1X2</div><div class="tab ${mv==='OVER'?'active':''}" onclick="event.stopPropagation();setTab(${idx},'OVER')">Over</div><div class="tab ${mv==='GOL'?'active':''}" onclick="event.stopPropagation();setTab(${idx},'GOL')">Gol</div><div class="tab ${mv==='ESATTO'?'active':''}" onclick="event.stopPropagation();setTab(${idx},'ESATTO')">Esatto</div></div>`;if(mv==='1X2')h+=`<div class="odds"><div class="o-btn ${isS(idx,'1')?'sel':''}" onclick="pick(${idx},'1','${m.home}',${o.h2h.h})">1 ${o.h2h.h}</div><div class="o-btn ${isS(idx,'X')?'sel':''}" onclick="pick(${idx},'X','X',${o.h2h.x})">X ${o.h2h.x}</div><div class="o-btn ${isS(idx,'2')?'sel':''}" onclick="pick(${idx},'2','${m.away}',${o.h2h.a})">2 ${o.h2h.a}</div></div>`;if(mv==='OVER')h+=`<div class="odds odds2">`+o.totals.map(t=>`<div class="o-btn ${isS(idx,t.name)?'sel':''}" onclick="pick(${idx},'${t.name}','${t.name}',${t.price})">${t.name} ${t.price}</div>`).join('')+`</div>`;if(mv==='GOL')h+=`<div class="odds odds2"><div class="o-btn ${isS(idx,'Gol')?'sel':''}" onclick="pick(${idx},'Gol','Gol',${o.btts.Yes})">Gol ${o.btts.Yes}</div><div class="o-btn ${isS(idx,'NoGol')?'sel':''}" onclick="pick(${idx},'NoGol','NoGol',${o.btts.No})">NoGol ${o.btts.No}</div></div>`;if(mv==='ESATTO')h+=`<div class="odds odds4">`+o.correct.map(c=>`<div class="o-btn ${isS(idx,c.name)?'sel':''}" onclick="pick(${idx},'${c.name}','${c.name}',${c.price})">${c.name} ${c.price}</div>`).join('')+`</div>`;h+=`</div>`;});h+=`</div></div>`;});document.getElementById('matches').innerHTML=h;}
function setTab(i,t){marketView[i]=t;render();}function isS(i,t){return slip.find(s=>s.idx===i&&s.t===t)}
function pick(i,t,n,o){let ex=slip.findIndex(s=>s.idx===i&&s.t===t);if(ex>=0)slip.splice(ex,1);else{slip=slip.filter(s=>!(s.idx===i&&['1','X','2'].includes(s.t)&&['1','X','2'].includes(t)));slip.push({idx:i,t,n,o,match:allM[i].home+' vs '+allM[i].away,league:pretty(allM[i].league)});}render();let c=document.getElementById('slip');document.getElementById('cnt').innerText=slip.length;if(!slip.length){c.innerHTML='Nessuna';document.getElementById('stakeBox').style.display='none';return;}document.getElementById('stakeBox').style.display='block';c.innerHTML=slip.map((s,j)=>`<div style="background:#1f1f2b;padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between"><div><b>${s.league}</b><br>${s.match}<br>${s.t} @${s.o}</div><div onclick="slip.splice(${j},1);render();document.getElementById('cnt').innerText=slip.length" style="color:#f55;font-weight:900;cursor:pointer">✕</div></div>`).join('');upd();}
function upd(){let st=parseFloat(document.getElementById('stake').value)||5,tot=slip.reduce((a,b)=>a*b.o,1),pot=(tot*st).toFixed(2);document.getElementById('qTot').innerText=tot.toFixed(2);document.getElementById('vTot').innerText=pot+'€';document.getElementById('pot').innerText=pot+'€';}
async function place(){let st=parseFloat(document.getElementById('stake').value)||5;if(st>balance)return alert('Saldo insufficiente: hai '+balance+'€');let tot=slip.reduce((a,b)=>a*b.o,1),pot=tot*st;balance-=st;await supa.from('users').update({balance:balance}).eq('username',user);await supa.from('bets').insert([{username:user,stake:st,total_odds:tot,potential_win:pot,picks:slip}]);document.getElementById('bal').innerText=balance.toFixed(2)+'€';slip=[];document.getElementById('cnt').innerText='0';document.getElementById('stakeBox').style.display='none';document.getElementById('slip').innerHTML='✅ Piazzata!';loadMyBets();}
async function loadMyBets(){let {data}=await supa.from('bets').select('*').eq('username',user).order('created_at',{ascending:false}).limit(20);document.getElementById('my').innerHTML=data.map(b=>`<div style="background:#1f1f2b;padding:10px;border-radius:10px;margin-bottom:8px;border-left:4px solid #ffcc00">${new Date(b.created_at).toLocaleString('it-IT')} - ${b.stake}€ @${b.total_odds.toFixed(2)}<br>${b.picks.map(p=>p.match+' '+p.t).join('<br>')}<br><span style="color:#ffcc00">Pot: ${b.potential_win.toFixed(2)}€</span></div>`).join('')||'Nessuna';}
loadLive();setInterval(loadLive,3600000);
</script></body></html>
